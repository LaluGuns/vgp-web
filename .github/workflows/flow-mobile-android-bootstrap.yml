name: Flow Android hybrid bootstrap

on:
  push:
    branches:
      - flow-android-hybrid-v1
    paths:
      - ".github/workflows/flow-mobile-android-bootstrap.yml"
      - "flowstate/mobile/**"
      - "!flowstate/mobile/android/**"
      - "flowstate/capacitor.config.ts"
      - "flowstate/package.json"
      - "flowstate/package-lock.json"
      - "flowstate/app/**"
      - "flowstate/components/**"
      - "flowstate/hooks/**"
      - "flowstate/lib/**"
      - "flowstate/public/**"

permissions:
  contents: read

concurrency:
  group: flow-mobile-android-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flowstate

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies
        run: npm ci

      - name: Verify shared mobile source
        run: |
          npm run mobile:verify
          npm run mobile:test
          npm run mobile:typecheck
          npm run mobile:build
          npm audit --omit=dev --audit-level=high

      - name: Generate clean Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/android
          npx cap add android

      - name: Apply Flow native Android overlay
        run: npm run mobile:apply:android

      - name: Sync Flow bundle into Android
        run: npx cap sync android

      - name: Verify Android Play release source
        run: npm run mobile:verify:android-release

      - name: Validate Windows signed-build authority
        working-directory: .
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "flowstate/mobile/scripts/build-android-release.ps1"
          $content = Get-Content $path -Raw
          [scriptblock]::Create($content) | Out-Null
          foreach ($required in @(
            "CreateUploadKeyIfMissing",
            "ExpectedUploadCertSha256",
            "SOURCE_MANIFEST_SHA256.txt",
            "testReleaseUnitTest",
            "jarsigner -verify -strict -certs",
            "FLOW_ANDROID_BUILD_RECEIPT.json",
            "Assert-NoNativeLibraries",
            "ApkSignerPath",
            "Node.js 24",
            "JDK 21",
            "npm ci"
          )) {
            if (-not $content.Contains($required)) {
              throw "Signed-build authority is missing required gate: $required"
            }
          }
          Write-Host "Windows signed-build authority syntax/invariants PASS"

      - name: Compile debug and release gates
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest testReleaseUnitTest lintDebug bundleRelease lintRelease
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Verify generated Android authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com.virzyguns.flow' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'FlowBillingPlugin.class' mobile/android/app/src/main/java/com/virzyguns/flow/MainActivity.java
          grep -q 'billing:9.1.0' mobile/android/app/build.gradle
          grep -q 'media3-session:1.11.0' mobile/android/app/build.gradle
          grep -q 'versionCode 1' mobile/android/app/build.gradle
          grep -q 'versionName "1.0.0"' mobile/android/app/build.gradle
          grep -q 'FLOW_UPLOAD_STORE_FILE' mobile/android/app/build.gradle
          grep -q 'targetSdkVersion = 36' mobile/android/variables.gradle
          grep -q 'android:allowBackup="false"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q '"CapacitorHttp"' mobile/android/app/src/main/assets/capacitor.config.json
          grep -q '"enabled": true' mobile/android/app/src/main/assets/capacitor.config.json

          MERGED_MANIFEST="$(find mobile/android/app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)"
          test -n "${MERGED_MANIFEST}"
          grep -q 'com.android.vending.BILLING' "${MERGED_MANIFEST}"
          grep -q 'com.google.android.play.billingclient.version' "${MERGED_MANIFEST}"

          if grep -R -n -E 'SUPABASE_SERVICE_ROLE|GOOGLE_PLAY_SERVICE_ACCOUNT_JSON|PRIVATE_KEY|CRON_SECRET|LEMONSQUEEZY_WEBHOOK_SECRET' mobile/android/app/src/main; then
            echo 'Server secret identifier leaked into generated Android source'
            exit 1
          fi

          if unzip -Z1 mobile/android/app/build/outputs/bundle/release/app-release.aab | grep -E '\.so$'; then
            echo 'Native .so libraries detected. Explicit Android 16 KB page-size verification is required before this release can pass.'
            exit 1
          fi
          echo 'Native library gate PASS: no .so files in release AAB'

      - name: Verify generated Android is committed
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- flowstate/mobile/android; then
            echo "Generated Android project drifted from the committed authority."
            echo "Regenerate it intentionally and commit the exact output before release CI can pass."
            exit 1
          fi

      - name: Package exact Codex-ready authority
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts

          HEAD_SHA="${GITHUB_SHA}"
          SOURCE_MANIFEST="flowstate/mobile/SOURCE_MANIFEST_SHA256.txt"
          BUILD_AUTHORITY="flowstate/mobile/BUILD_AUTHORITY.json"
          INTERNAL_HANDOFF="flowstate/CODEX_ANDROID_BUILD_HANDOFF.md"

          git ls-files -z flowstate | xargs -0 sha256sum > "${SOURCE_MANIFEST}"

          cat > "${BUILD_AUTHORITY}" <<EOF
          {
            "product": "Flow",
            "package": "com.virzyguns.flow",
            "versionName": "1.0.0",
            "versionCode": 1,
            "minSdk": 26,
            "compileSdk": 36,
            "targetSdk": 36,
            "branch": "flow-android-hybrid-v1",
            "commit": "${HEAD_SHA}",
            "sourceManifest": "mobile/SOURCE_MANIFEST_SHA256.txt",
            "ciSigned": false,
            "internalTestingPassed": false
          }
          EOF

          cat > "${INTERNAL_HANDOFF}" <<EOF
          # Flow Android Codex Build Handoff

          This archive is the Android release source authority for Flow.

          Authority branch: flow-android-hybrid-v1
          Authority commit: ${HEAD_SHA}
          Package: com.virzyguns.flow
          Version: 1.0.0 (versionCode 1)
          Target: Android API 36
          Architecture: Capacitor hybrid using the real Flow React UI. Do not recreate the UI in Compose, React Native, Flutter, or another design system.

          ## Non-negotiable rules

          - Build only from this extracted archive. Do not mix files from older Flow Android folders or ZIPs.
          - Do not edit mobile/android as the primary source. Native authority is mobile/native/android plus mobile/scripts/apply-android-native.mjs.
          - Do not store a private upload key, passwords, service-account JSON, or server secrets in the repo, Drive, build artifact, or chat.
          - Do not create a new upload key implicitly. Preserve an existing Flow upload key if one already exists.
          - Do not upload the CI unsigned AAB to Play.
          - Do not call the app production-ready until Google Play Internal Testing and real-device gates pass.

          ## Signed build command

          Open PowerShell in the extracted flowstate folder.

          Existing upload key:

              powershell -ExecutionPolicy Bypass -File .\mobile\scripts\build-android-release.ps1

          First signing setup only, after confirming there is no existing Flow upload key/certificate to preserve:

              powershell -ExecutionPolicy Bypass -File .\mobile\scripts\build-android-release.ps1 -CreateUploadKeyIfMissing

          If Google Play already shows an expected upload-certificate SHA-256, enforce it:

              powershell -ExecutionPolicy Bypass -File .\mobile\scripts\build-android-release.ps1 -ExpectedUploadCertSha256 "<PLAY_SHA256>"

          The script must fail closed on source-manifest drift, dirty Git authority, wrong Node/JDK versions, incomplete signing credentials, certificate mismatch, source/regression/typecheck/build/audit failures, native overlay drift, release lint/tests, signature verification, or unexpected native .so libraries.

          ## Valid output

          Only artifacts/android-release is release output. A successful run must contain:

          - flow-android-v1.0.0-build1-signed.aab
          - flow-android-v1.0.0-build1-signed.apk
          - SHA256SUMS.txt
          - FLOW_ANDROID_SIGNING_CERT.txt
          - FLOW_UPLOAD_CERTIFICATE.pem
          - FLOW_ANDROID_BUILD_RECEIPT.json

          FLOW_ANDROID_BUILD_RECEIPT.json must still say internalTestingPassed=false. Internal Testing is a later manual/runtime gate.
          EOF

          git ls-files -z flowstate | xargs -0 zip -q artifacts/FLOW_ANDROID_HYBRID_CODEX_READY.zip
          zip -q artifacts/FLOW_ANDROID_HYBRID_CODEX_READY.zip "${SOURCE_MANIFEST}" "${BUILD_AUTHORITY}" "${INTERNAL_HANDOFF}"

          cp flowstate/mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/FLOW_ANDROID_HYBRID_DEBUG.apk
          cp flowstate/mobile/android/app/build/outputs/bundle/release/app-release.aab artifacts/FLOW_ANDROID_HYBRID_RELEASE_UNSIGNED.aab
          cp "${SOURCE_MANIFEST}" artifacts/SOURCE_MANIFEST_SHA256.txt
          cp "${BUILD_AUTHORITY}" artifacts/BUILD_AUTHORITY.json
          cp "${INTERNAL_HANDOFF}" artifacts/FLOW_ANDROID_HYBRID_CODEX_HANDOFF.md

          sha256sum \
            artifacts/FLOW_ANDROID_HYBRID_CODEX_READY.zip \
            artifacts/FLOW_ANDROID_HYBRID_DEBUG.apk \
            artifacts/FLOW_ANDROID_HYBRID_RELEASE_UNSIGNED.aab \
            artifacts/SOURCE_MANIFEST_SHA256.txt \
            artifacts/BUILD_AUTHORITY.json \
            artifacts/FLOW_ANDROID_HYBRID_CODEX_HANDOFF.md \
            > artifacts/SHA256SUMS.txt

      - name: Upload Codex-ready Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-android-hybrid-codex-ready
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
