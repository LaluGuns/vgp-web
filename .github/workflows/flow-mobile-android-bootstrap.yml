name: Flow Android hybrid bootstrap

on:
  push:
    branches:
      - flow-android-hybrid-v1
    paths:
      - ".github/workflows/flow-mobile-android-bootstrap.yml"
      - "flowstate/mobile/**"
      - "!flowstate/mobile/android/**"
      - "flowstate/capacitor.config.ts"
      - "flowstate/package.json"
      - "flowstate/package-lock.json"
      - "flowstate/app/**"
      - "flowstate/components/**"
      - "flowstate/hooks/**"
      - "flowstate/lib/**"
      - "flowstate/public/**"

permissions:
  contents: write

concurrency:
  group: flow-mobile-android-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flowstate

    steps:
      - uses: actions/checkout@v4
        with:
          ref: flow-android-hybrid-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies
        run: npm ci

      - name: Verify shared mobile source
        run: |
          npm run mobile:verify
          npm run mobile:typecheck
          npm run mobile:build
          npm audit --omit=dev --audit-level=high

      - name: Generate clean Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/android
          npx cap add android

      - name: Apply Flow native Android overlay
        run: npm run mobile:apply:android

      - name: Sync Flow bundle into Android
        run: npx cap sync android

      - name: Verify Android Play release source
        run: npm run mobile:verify:android-release

      - name: Compile debug and release gates
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug bundleRelease lintRelease
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Verify generated Android authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com.virzyguns.flow' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'FlowBillingPlugin.class' mobile/android/app/src/main/java/com/virzyguns/flow/MainActivity.java
          grep -q 'billing:9.1.0' mobile/android/app/build.gradle
          grep -q 'media3-session:1.11.0' mobile/android/app/build.gradle
          grep -q 'versionCode 1' mobile/android/app/build.gradle
          grep -q 'versionName "1.0.0"' mobile/android/app/build.gradle
          grep -q 'FLOW_UPLOAD_STORE_FILE' mobile/android/app/build.gradle
          grep -q 'targetSdkVersion = 36' mobile/android/variables.gradle
          grep -q 'android:allowBackup="false"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q '"CapacitorHttp"' mobile/android/app/src/main/assets/capacitor.config.json
          grep -q '"enabled": true' mobile/android/app/src/main/assets/capacitor.config.json

          MERGED_MANIFEST="$(find mobile/android/app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)"
          test -n "${MERGED_MANIFEST}"
          grep -q 'com.android.vending.BILLING' "${MERGED_MANIFEST}"
          grep -q 'com.google.android.play.billingclient.version' "${MERGED_MANIFEST}"

          if grep -R -n -E 'SUPABASE_SERVICE_ROLE|GOOGLE_PLAY_SERVICE_ACCOUNT_JSON|PRIVATE_KEY|CRON_SECRET|LEMONSQUEEZY_WEBHOOK_SECRET' mobile/android/app/src/main; then
            echo 'Server secret identifier leaked into generated Android source'
            exit 1
          fi

      - name: Commit verified generated Android project
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flowstate/mobile/android
          if git diff --cached --quiet; then
            echo "Generated Android project already matches source."
            exit 0
          fi
          git commit -m "Generate verified Flow Capacitor Android project"
          git push origin HEAD:flow-android-hybrid-v1

      - name: Package Codex-ready hybrid authority
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          git ls-files -z flowstate | xargs -0 zip -q artifacts/FLOW_ANDROID_HYBRID_CODEX_READY.zip
          cp flowstate/mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/FLOW_ANDROID_HYBRID_DEBUG.apk
          cp flowstate/mobile/android/app/build/outputs/bundle/release/app-release.aab artifacts/FLOW_ANDROID_HYBRID_RELEASE_UNSIGNED.aab
          sha256sum artifacts/FLOW_ANDROID_HYBRID_CODEX_READY.zip artifacts/FLOW_ANDROID_HYBRID_DEBUG.apk artifacts/FLOW_ANDROID_HYBRID_RELEASE_UNSIGNED.aab > artifacts/SHA256SUMS.txt
          HEAD_SHA="$(git rev-parse HEAD)"
          cat > artifacts/FLOW_ANDROID_HYBRID_CODEX_HANDOFF.md <<EOF
          # Flow Android Hybrid Codex Handoff

          Authority branch: flow-android-hybrid-v1
          Authority commit: ${HEAD_SHA}
          Package: com.virzyguns.flow
          Version: 1.0.0 (versionCode 1)
          Target: Android 16 / API 36
          Architecture: Capacitor hybrid. Shared Flow web pages and app/globals.css are the UI authority. Do not rebuild the UI in Compose.

          Verified in CI before packaging:
          - mobile source authority
          - TypeScript mobile typecheck
          - production Vite mobile bundle
          - production dependency audit at high severity
          - clean Capacitor Android generation
          - native HTTPS transport
          - Google Play Billing 9.1.0
          - Play Billing permission and billing-client manifest metadata in release merge
          - Media3 1.11.0
          - assembleDebug
          - testDebugUnitTest
          - lintDebug
          - bundleRelease
          - lintRelease
          - unsigned release AAB generation
          - generated Android secret scan

          The CI AAB is intentionally unsigned. Never store the Flow upload private key or passwords in GitHub or Drive.

          Windows/Codex signed release build after extracting the source ZIP:

              cd flowstate
              powershell -ExecutionPolicy Bypass -File .\mobile\scripts\build-android-release.ps1

          On first run the script creates a dedicated Flow upload key under LOCALAPPDATA, stores its password only in a Windows DPAPI-encrypted credential file, runs all source/release gates, signs the release AAB, verifies the AAB signature, and writes the final signed bundle under flowstate\artifacts\android-release.

          Google Play final runtime gate:
          - enroll/use Play App Signing
          - upload the signed AAB to Internal Testing
          - install from Play, not adb sideload, for billing verification
          - verify sign-in/auth callback
          - verify monthly and yearly Play products and localized prices
          - verify PURCHASED unlock only after server verification
          - verify PENDING never unlocks until it becomes PURCHASED
          - verify restore purchases
          - verify cancel/renew/restart state refresh
          - verify background audio and lock-screen controls
          - verify timer notification permission and delivery
          - verify no crash/ANR on at least one Android 13-15 device and an Android 16 emulator/device

          Do not promote beyond Internal Testing until those runtime checks pass.
          EOF

      - name: Upload Codex-ready Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-android-hybrid-codex-ready
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
