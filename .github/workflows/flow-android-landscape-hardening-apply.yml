name: Apply Flow Android landscape hardening

on:
  push:
    branches:
      - flow-android-hybrid-v1
    paths:
      - ".github/workflows/flow-android-landscape-hardening-apply.yml"

permissions:
  contents: write

concurrency:
  group: flow-android-landscape-hardening-apply
  cancel-in-progress: false

jobs:
  apply-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flow-android-hybrid-v1
          fetch-depth: 0

      - name: Decode and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/flow.patch.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/flow.patch.gz.b64 | gzip -d > /tmp/flow.patch
          git apply --check /tmp/flow.patch
          git apply /tmp/flow.patch

      - name: Run source and timer regression gates
        shell: bash
        run: |
          set -euo pipefail
          cd flowstate
          node mobile/scripts/verify-mobile-source.mjs
          npm run mobile:test
          node mobile/scripts/apply-android-native.mjs
          node mobile/scripts/verify-android-release.mjs

      - name: Commit audited hardening patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flowstate
          git commit -m "Harden Flow Android landscape and timer semantics"
          git push origin HEAD:flow-android-hybrid-v1
