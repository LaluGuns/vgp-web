name: Flow social card visual QA

on:
  pull_request:
    paths:
      - ".github/workflows/flowstate-predeploy.yml"
      - "flowstate/**"

permissions:
  contents: read

jobs:
  verify-blueglass-card:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flowstate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Render social card
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/flow-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 5 --max-time 30 \
              -D /tmp/flow-social.headers \
              "http://127.0.0.1:3000/en/social-card-v7?v=20260822-blueglass-2227" \
              -o /tmp/flow-social.png; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            cat /tmp/flow-next.log || true
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          h=Path('/tmp/flow-social.headers').read_text(errors='replace').lower()
          b=Path('/tmp/flow-social.png').read_bytes()
          print('image bytes =', len(b))
          assert 'content-type: image/png' in h
          assert b.startswith(b'\x89PNG\r\n\x1a\n')
          assert len(b) > 10000
          PY

      - name: Assert no black outer background
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image

          im=Image.open('/tmp/flow-social.png').convert('RGB')
          print('size =', im.size)
          assert im.size == (1200,630)

          points={
            'top-left':(0,0),
            'top-right':(1199,0),
            'bottom-left':(0,629),
            'bottom-right':(1199,629),
            'top-mid':(600,0),
            'bottom-mid':(600,629),
            'left-mid':(0,315),
            'right-mid':(1199,315),
          }
          for name,p in points.items():
            rgb=im.getpixel(p)
            print(name, rgb)
            assert sum(rgb) > 260, f'{name} is too dark: {rgb}'
            assert max(rgb) > 120, f'{name} lacks blue/cyan brightness: {rgb}'

          edge=[]
          for y in range(im.height):
            for x in range(24):
              edge.append(im.getpixel((x,y)))
              edge.append(im.getpixel((im.width-1-x,y)))
          for x in range(im.width):
            for y in range(24):
              edge.append(im.getpixel((x,y)))
              edge.append(im.getpixel((x,im.height-1-y)))

          near_black=sum(1 for r,g,b in edge if r < 45 and g < 45 and b < 45)
          ratio=near_black/len(edge)
          print('near-black edge pixels =', near_black, '/', len(edge), 'ratio=', ratio)
          assert ratio < 0.001, f'outer edge still contains black background: {ratio:.4%}'
          PY

      - name: Upload rendered social card
        uses: actions/upload-artifact@v4
        with:
          name: flow-blueglass-social-card
          path: /tmp/flow-social.png
          if-no-files-found: error
