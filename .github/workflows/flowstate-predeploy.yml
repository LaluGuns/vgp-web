name: Flow live social QA

on:
  pull_request:
    paths:
      - ".github/workflows/flowstate-predeploy.yml"

permissions:
  contents: read

jobs:
  verify-live-linkedin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live Flow card for LinkedInBot
        shell: bash
        run: |
          set -euo pipefail
          HTML=/tmp/linkedin.html
          IMG=/tmp/linkedin.png
          HEADERS=/tmp/linkedin.headers
          IMAGE_URL_FILE=/tmp/linkedin-image-url
          EXPECTED_VERSION='20260822-blueglass-2227'

          ok=0
          for attempt in $(seq 1 36); do
            echo "live attempt ${attempt}/36"
            if curl --fail --silent --show-error --location \
              --user-agent 'LinkedInBot/1.0' \
              --connect-timeout 10 --max-time 30 \
              'https://flow.virzyguns.com/' -o "$HTML"; then
              if HTML="$HTML" IMAGE_URL_FILE="$IMAGE_URL_FILE" EXPECTED_VERSION="$EXPECTED_VERSION" python - <<'PY'
          import os
          from html.parser import HTMLParser

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.meta={}
              def handle_starttag(self, tag, attrs):
                  if tag.lower()!='meta': return
                  d={k.lower():v for k,v in attrs if k and v is not None}
                  key=d.get('property') or d.get('name')
                  if key and d.get('content'): self.meta[key.lower()]=d['content']

          p=P(); p.feed(open(os.environ['HTML'],encoding='utf-8').read())
          og=p.meta.get('og:image','')
          title=p.meta.get('og:title','')
          ogurl=p.meta.get('og:url','')
          print('og:title =',title)
          print('og:image =',og)
          print('og:url =',ogurl)
          assert '/social-card-v7' in og
          assert os.environ['EXPECTED_VERSION'] in og
          assert ogurl == 'https://flow.virzyguns.com'
          open(os.environ['IMAGE_URL_FILE'],'w').write(og)
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 5
          done

          test "$ok" -eq 1
          IMAGE_URL="$(cat "$IMAGE_URL_FILE")"
          curl --fail --silent --show-error --location \
            --user-agent 'LinkedInBot/1.0' \
            --connect-timeout 10 --max-time 45 \
            -D "$HEADERS" "$IMAGE_URL" -o "$IMG"

          python -m pip install --quiet pillow
          HEADERS="$HEADERS" IMG="$IMG" python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          headers=Path(os.environ['HEADERS']).read_text(errors='replace').lower()
          raw=Path(os.environ['IMG']).read_bytes()
          assert 'content-type: image/png' in headers
          assert raw.startswith(b'\x89PNG\r\n\x1a\n')
          assert len(raw)>10000

          im=Image.open(os.environ['IMG']).convert('RGB')
          print('live size =',im.size,'bytes =',len(raw))
          assert im.size == (1200,630)

          points={
            'top-left':(0,0),'top-right':(1199,0),
            'bottom-left':(0,629),'bottom-right':(1199,629),
            'top-mid':(600,0),'bottom-mid':(600,629),
            'left-mid':(0,315),'right-mid':(1199,315),
          }
          for name,p in points.items():
            rgb=im.getpixel(p)
            print(name,rgb)
            assert sum(rgb)>260, f'{name} too dark: {rgb}'

          edge=[]
          for y in range(im.height):
            for x in range(24):
              edge.extend((im.getpixel((x,y)),im.getpixel((im.width-1-x,y))))
          for x in range(im.width):
            for y in range(24):
              edge.extend((im.getpixel((x,y)),im.getpixel((x,im.height-1-y))))
          near_black=sum(1 for r,g,b in edge if r<45 and g<45 and b<45)
          ratio=near_black/len(edge)
          print('LIVE near-black edge ratio =',ratio)
          assert ratio < 0.001
          PY

      - name: Upload live LinkedIn card
        uses: actions/upload-artifact@v4
        with:
          name: flow-live-linkedin-card
          path: /tmp/linkedin.png
          if-no-files-found: error
