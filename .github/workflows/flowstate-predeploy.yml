name: Flowstate predeploy

on:
  pull_request:
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"
  push:
    branches: [main]
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"

permissions:
  contents: read

concurrency:
  group: flowstate-predeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-card-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect production Twitterbot response
        shell: bash
        run: |
          set -euo pipefail
          PAGE_URL="https://flow.virzyguns.com/?social=20260821-v2"
          USER_AGENT="Twitterbot/1.0"

          curl --fail --silent --show-error --location \
            --user-agent "$USER_AGENT" \
            --connect-timeout 10 --max-time 30 \
            -D /tmp/page.headers \
            "$PAGE_URL" -o /tmp/page.html

          echo "===== PAGE HEADERS ====="
          cat /tmp/page.headers

          python - <<'PY'
          from html.parser import HTMLParser

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "meta":
                      return
                  data = {k.lower(): v for k, v in attrs if k and v is not None}
                  key = data.get("property") or data.get("name")
                  value = data.get("content")
                  if key and value and (key.lower().startswith("twitter:") or key.lower().startswith("og:")):
                      self.meta.append((key, value))

          html = open("/tmp/page.html", encoding="utf-8").read()
          parser = MetaParser()
          parser.feed(html)
          print("===== SOCIAL META =====")
          for key, value in parser.meta:
              print(f"{key} = {value}")

          values = {k.lower(): v for k, v in parser.meta}
          image = values.get("twitter:image") or values.get("og:image") or ""
          print("SELECTED_IMAGE =", image)
          open("/tmp/image-url", "w", encoding="utf-8").write(image)

          if values.get("twitter:card") != "summary_large_image":
              raise SystemExit("twitter:card mismatch")
          if "20260821-player-v2" not in image:
              raise SystemExit("live social image metadata is stale")
          PY

          IMAGE_URL="$(cat /tmp/image-url)"
          curl --fail --silent --show-error --location \
            --user-agent "$USER_AGENT" \
            --connect-timeout 10 --max-time 45 \
            -D /tmp/image.headers \
            "$IMAGE_URL" -o /tmp/image.bin

          echo "===== IMAGE HEADERS ====="
          cat /tmp/image.headers

          python - <<'PY'
          from pathlib import Path
          headers = Path("/tmp/image.headers").read_text(errors="replace").lower()
          data = Path("/tmp/image.bin").read_bytes()
          print("IMAGE_BYTES =", len(data))
          print("PNG_SIGNATURE =", data[:8].hex())
          if "content-type: image/png" not in headers:
              raise SystemExit("image content-type is not PNG")
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("image body is not PNG")
          if len(data) < 10_000:
              raise SystemExit("image is unexpectedly small")
          PY

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flowstate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      - name: Verify live X social card
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          PAGE_URL="https://flow.virzyguns.com/?social=20260821-v2"
          EXPECTED_IMAGE_VERSION="20260821-player-v2"
          USER_AGENT="Twitterbot/1.0"

          ok=0
          for attempt in $(seq 1 24); do
            echo "Live social-card check ${attempt}/24"

            if curl --fail --silent --show-error --location \
              --user-agent "$USER_AGENT" \
              --connect-timeout 10 --max-time 30 \
              "$PAGE_URL" -o /tmp/flow-social.html; then

              if EXPECTED_IMAGE_VERSION="$EXPECTED_IMAGE_VERSION" python - <<'PY'
          import os
          from html.parser import HTMLParser

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "meta":
                      return
                  data = {k.lower(): v for k, v in attrs if k and v is not None}
                  key = data.get("property") or data.get("name")
                  value = data.get("content")
                  if key and value:
                      self.meta[key.lower()] = value

          html = open("/tmp/flow-social.html", encoding="utf-8").read()
          parser = MetaParser()
          parser.feed(html)

          expected = os.environ["EXPECTED_IMAGE_VERSION"]
          twitter_card = parser.meta.get("twitter:card", "")
          twitter_image = parser.meta.get("twitter:image", "")
          og_image = parser.meta.get("og:image", "")

          print("twitter:card =", twitter_card)
          print("twitter:image =", twitter_image)
          print("og:image =", og_image)

          if twitter_card != "summary_large_image":
              raise SystemExit("twitter:card is not summary_large_image")
          if expected not in twitter_image:
              raise SystemExit("twitter:image is stale or missing")
          if expected not in og_image:
              raise SystemExit("og:image is stale or missing")

          open("/tmp/flow-social-image-url", "w", encoding="utf-8").write(twitter_image)
          PY
              then
                IMAGE_URL="$(cat /tmp/flow-social-image-url)"
                if curl --fail --silent --show-error --location \
                  --user-agent "$USER_AGENT" \
                  --connect-timeout 10 --max-time 45 \
                  -D /tmp/flow-social-image.headers \
                  "$IMAGE_URL" -o /tmp/flow-social-image.bin; then

                  python - <<'PY'
          from pathlib import Path

          headers = Path("/tmp/flow-social-image.headers").read_text(errors="replace").lower()
          image = Path("/tmp/flow-social-image.bin").read_bytes()

          print("image bytes =", len(image))
          if "content-type: image/png" not in headers:
              raise SystemExit("social image did not return image/png")
          if not image.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("social image response is not a valid PNG")
          if len(image) < 10_000:
              raise SystemExit("social image PNG is unexpectedly small")
          PY
                  ok=1
                  break
                fi
              fi
            fi

            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "Flow live social card did not converge to the expected metadata/image."
            exit 1
          fi

          echo "Flow live social card is serving fresh X metadata and a valid PNG."
