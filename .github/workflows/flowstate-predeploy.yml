name: Flowstate predeploy

on:
  pull_request:
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"
  push:
    branches: [main]
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"

permissions:
  contents: read

concurrency:
  group: flowstate-predeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flowstate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      - name: Verify v5 image in Vercel Preview
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          URL="https://flowstate-git-fix-flow-soci-f6ccbf-lalu-virzy-gunawans-projects.vercel.app/en/social-card-v5"
          ok=0
          for attempt in $(seq 1 24); do
            echo "Preview image check ${attempt}/24"
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 45 \
              -D /tmp/flow-v5.headers "$URL" -o /tmp/flow-v5.bin; then
              if python - <<'PY'
          from pathlib import Path
          headers = Path('/tmp/flow-v5.headers').read_text(errors='replace').lower()
          image = Path('/tmp/flow-v5.bin').read_bytes()
          print('image bytes =', len(image))
          if 'content-type: image/png' not in headers:
              raise SystemExit('not image/png')
          if not image.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('not a PNG')
          if len(image) < 10000:
              raise SystemExit('PNG unexpectedly small')
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Verify live social cards
        if: github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_IMAGE_PATH="/social-card-v4"
          for ua in "Twitterbot/1.0" "facebookexternalhit/1.1"; do
            curl --fail --silent --show-error --location \
              --user-agent "$ua" \
              --connect-timeout 10 --max-time 30 \
              "https://flow.virzyguns.com/?qa=20260822-social-v4" -o /tmp/flow-social.html
            grep -q "$EXPECTED_IMAGE_PATH" /tmp/flow-social.html
          done
