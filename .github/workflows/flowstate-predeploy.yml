name: Flow root social QA

on:
  pull_request:
    paths:
      - ".github/workflows/flowstate-predeploy.yml"

permissions:
  contents: read

jobs:
  verify-root-social:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify bare Flow URL for social crawlers
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local LABEL="$1"
            local UA="$2"
            local HTML="/tmp/${LABEL}.html"
            local IMG="/tmp/${LABEL}.png"
            local HEADERS="/tmp/${LABEL}.headers"
            local IMAGE_URL_FILE="/tmp/${LABEL}-image-url"

            curl --fail --silent --show-error --location \
              --user-agent "$UA" \
              --connect-timeout 10 --max-time 30 \
              "https://flow.virzyguns.com/" -o "$HTML"

            HTML="$HTML" IMAGE_URL_FILE="$IMAGE_URL_FILE" python - <<'PY'
          import os
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.meta = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta': return
                  d = {k.lower(): v for k, v in attrs if k and v is not None}
                  key = d.get('property') or d.get('name')
                  if key and d.get('content'): self.meta[key.lower()] = d['content']
          p = P(); p.feed(open(os.environ['HTML'], encoding='utf-8').read())
          card = p.meta.get('twitter:card', '')
          og = p.meta.get('og:image', '')
          tw = p.meta.get('twitter:image', '')
          ogurl = p.meta.get('og:url', '')
          ogtitle = p.meta.get('og:title', '')
          print('twitter:card =', card)
          print('og:image =', og)
          print('twitter:image =', tw)
          print('og:url =', ogurl)
          print('og:title =', ogtitle)
          assert card == 'summary_large_image'
          assert '/en/social-card-v7?v=20260822-fullbleed-0808' in og
          assert '/en/social-card-v7?v=20260822-fullbleed-0808' in tw
          assert ogurl == 'https://flow.virzyguns.com'
          assert '—' not in ogtitle and '–' not in ogtitle
          open(os.environ['IMAGE_URL_FILE'], 'w').write(og)
          PY

            IMAGE_URL="$(cat "$IMAGE_URL_FILE")"
            curl --fail --silent --show-error --location \
              --user-agent "$UA" \
              --connect-timeout 10 --max-time 45 \
              -D "$HEADERS" "$IMAGE_URL" -o "$IMG"

            HEADERS="$HEADERS" IMG="$IMG" python - <<'PY'
          import os
          from pathlib import Path
          h = Path(os.environ['HEADERS']).read_text(errors='replace').lower()
          b = Path(os.environ['IMG']).read_bytes()
          print('image bytes =', len(b))
          assert 'content-type: image/png' in h
          assert b.startswith(b'\x89PNG\r\n\x1a\n')
          assert len(b) > 10000
          PY
          }

          verify twitter Twitterbot/1.0
          verify facebook facebookexternalhit/1.1
