name: LinkedIn social QA

on:
  pull_request:
    paths:
      - ".github/workflows/flowstate-predeploy.yml"

permissions:
  contents: read

jobs:
  verify-linkedin-root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify bare Flow URL for LinkedInBot
        shell: bash
        run: |
          set -euo pipefail
          HTML=/tmp/linkedin.html
          HEADERS=/tmp/linkedin-image.headers
          IMG=/tmp/linkedin-image.png

          curl --fail --silent --show-error --location \
            --user-agent "LinkedInBot/1.0" \
            --connect-timeout 10 --max-time 30 \
            "https://flow.virzyguns.com/" -o "$HTML"

          HTML="$HTML" python - <<'PY'
          import os
          from html.parser import HTMLParser

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.meta = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta': return
                  d = {k.lower(): v for k, v in attrs if k and v is not None}
                  key = d.get('property') or d.get('name')
                  if key and d.get('content'): self.meta[key.lower()] = d['content']

          p = P(); p.feed(open(os.environ['HTML'], encoding='utf-8').read())
          og = p.meta.get('og:image', '')
          title = p.meta.get('og:title', '')
          ogurl = p.meta.get('og:url', '')
          print('og:title =', title)
          print('og:image =', og)
          print('og:url =', ogurl)
          assert title == 'Flow by Virzy Guns: Get in the zone.'
          assert '/en/social-card-v7?v=20260822-fullbleed-0808' in og
          assert ogurl == 'https://flow.virzyguns.com'
          open('/tmp/linkedin-image-url', 'w').write(og)
          PY

          IMAGE_URL="$(cat /tmp/linkedin-image-url)"
          curl --fail --silent --show-error --location \
            --user-agent "LinkedInBot/1.0" \
            --connect-timeout 10 --max-time 45 \
            -D "$HEADERS" "$IMAGE_URL" -o "$IMG"

          HEADERS="$HEADERS" IMG="$IMG" python - <<'PY'
          import os
          from pathlib import Path
          h = Path(os.environ['HEADERS']).read_text(errors='replace').lower()
          b = Path(os.environ['IMG']).read_bytes()
          print('image bytes =', len(b))
          assert 'content-type: image/png' in h
          assert b.startswith(b'\x89PNG\r\n\x1a\n')
          assert len(b) > 10000
          PY

      - name: Probe LinkedIn Post Inspector refresh endpoint
        shell: bash
        run: |
          set -euo pipefail
          INSPECT_URL='https://www.linkedin.com/post-inspector/inspect/https:%2F%2Fflow.virzyguns.com%2F'
          STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36' \
            -D /tmp/inspector.headers -o /tmp/inspector.body \
            -w '%{http_code}' "$INSPECT_URL" || true)
          echo "post inspector status = $STATUS"
          echo '--- response headers ---'
          sed -n '1,40p' /tmp/inspector.headers || true
          echo '--- body preview ---'
          head -c 1000 /tmp/inspector.body || true
          echo
