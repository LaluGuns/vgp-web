name: Flowstate predeploy

on:
  pull_request:
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"
  push:
    branches: [main]
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"

permissions:
  contents: read

concurrency:
  group: flowstate-predeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flowstate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      - name: Verify exact static social preview asset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('public/social/flow-og-home-0808.jpg')
          b = p.read_bytes()
          print('static social preview bytes =', len(b))
          assert b.startswith(b'\xff\xd8\xff')
          assert len(b) > 50000
          PY

      - name: Verify bare Flow URL live
        if: github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_IMAGE_PATH="/social/flow-og-home-0808.jpg"

          verify() {
            local LABEL="$1"
            local UA="$2"
            local HTML="/tmp/${LABEL}.html"
            local IMG="/tmp/${LABEL}.jpg"
            local IMAGE_URL_FILE="/tmp/${LABEL}-image-url"
            local ok=0

            for attempt in $(seq 1 24); do
              echo "$LABEL attempt ${attempt}/24"
              if curl --fail --silent --show-error --location \
                --user-agent "$UA" \
                --connect-timeout 10 --max-time 30 \
                "https://flow.virzyguns.com/" -o "$HTML"; then
                if HTML="$HTML" IMAGE_URL_FILE="$IMAGE_URL_FILE" EXPECTED_IMAGE_PATH="$EXPECTED_IMAGE_PATH" python - <<'PY'
          import os
          from html.parser import HTMLParser

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.meta = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta': return
                  d = {k.lower(): v for k, v in attrs if k and v is not None}
                  key = d.get('property') or d.get('name')
                  if key and d.get('content'): self.meta[key.lower()] = d['content']

          p = P(); p.feed(open(os.environ['HTML'], encoding='utf-8').read())
          card = p.meta.get('twitter:card', '')
          og = p.meta.get('og:image', '')
          tw = p.meta.get('twitter:image', '')
          ogurl = p.meta.get('og:url', '')
          ogtitle = p.meta.get('og:title', '')
          print('twitter:card =', card)
          print('og:image =', og)
          print('twitter:image =', tw)
          print('og:url =', ogurl)
          print('og:title =', ogtitle)
          assert card == 'summary_large_image'
          assert os.environ['EXPECTED_IMAGE_PATH'] in og
          assert os.environ['EXPECTED_IMAGE_PATH'] in tw
          assert ogurl == 'https://flow.virzyguns.com'
          assert '—' not in ogtitle and '–' not in ogtitle
          open(os.environ['IMAGE_URL_FILE'], 'w').write(og)
          PY
                then
                  IMAGE_URL="$(cat "$IMAGE_URL_FILE")"
                  if curl --fail --silent --show-error --location \
                    --user-agent "$UA" \
                    --connect-timeout 10 --max-time 45 \
                    "$IMAGE_URL" -o "$IMG"; then
                    if IMG="$IMG" python - <<'PY'
          import os
          from pathlib import Path
          b = Path(os.environ['IMG']).read_bytes()
          print('image bytes =', len(b))
          assert b.startswith(b'\xff\xd8\xff')
          assert len(b) > 50000
          PY
                    then
                      ok=1
                      break
                    fi
                  fi
                fi
              fi
              sleep 10
            done

            test "$ok" -eq 1
            echo "$LABEL PASS"
          }

          verify twitter Twitterbot/1.0
          verify facebook facebookexternalhit/1.1
          verify linkedin LinkedInBot/1.0
