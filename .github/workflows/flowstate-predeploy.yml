name: Flowstate predeploy

on:
  pull_request:
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"
  push:
    branches: [main]
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"

permissions:
  contents: read

concurrency:
  group: flowstate-predeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flowstate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      - name: Verify live social cards
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          PAGE_URL="https://flow.virzyguns.com/?social=20260821-threads-player-v2"
          EXPECTED_IMAGE_VERSION="20260821-threads-player-v2"

          verify_agent() {
            local LABEL="$1"
            local USER_AGENT="$2"
            local PREFIX="$(echo "$LABEL" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
            local HTML="/tmp/flow-social-${PREFIX}.html"
            local IMAGE_URL_FILE="/tmp/flow-social-${PREFIX}-image-url"
            local IMAGE_HEADERS="/tmp/flow-social-${PREFIX}-image.headers"
            local IMAGE_BIN="/tmp/flow-social-${PREFIX}-image.bin"

            local ok=0
            for attempt in $(seq 1 24); do
              echo "$LABEL live social-card check ${attempt}/24"

              if curl --fail --silent --show-error --location \
                --user-agent "$USER_AGENT" \
                --connect-timeout 10 --max-time 30 \
                "$PAGE_URL" -o "$HTML"; then

                if HTML="$HTML" IMAGE_URL_FILE="$IMAGE_URL_FILE" EXPECTED_IMAGE_VERSION="$EXPECTED_IMAGE_VERSION" python - <<'PY'
          import os
          from html.parser import HTMLParser

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "meta":
                      return
                  data = {k.lower(): v for k, v in attrs if k and v is not None}
                  key = data.get("property") or data.get("name")
                  value = data.get("content")
                  if key and value:
                      self.meta[key.lower()] = value

          html = open(os.environ["HTML"], encoding="utf-8").read()
          parser = MetaParser()
          parser.feed(html)

          expected = os.environ["EXPECTED_IMAGE_VERSION"]
          twitter_card = parser.meta.get("twitter:card", "")
          twitter_image = parser.meta.get("twitter:image", "")
          og_image = parser.meta.get("og:image", "")

          print("twitter:card =", twitter_card)
          print("twitter:image =", twitter_image)
          print("og:image =", og_image)

          if twitter_card != "summary_large_image":
              raise SystemExit("twitter:card is not summary_large_image")
          if expected not in twitter_image:
              raise SystemExit("twitter:image is stale or missing")
          if expected not in og_image:
              raise SystemExit("og:image is stale or missing")
          if "/opengraph-image" not in og_image:
              raise SystemExit("og:image is missing the generated Flow card")

          open(os.environ["IMAGE_URL_FILE"], "w", encoding="utf-8").write(og_image)
          PY
                then
                  IMAGE_URL="$(cat "$IMAGE_URL_FILE")"
                  if curl --fail --silent --show-error --location \
                    --user-agent "$USER_AGENT" \
                    --connect-timeout 10 --max-time 45 \
                    -D "$IMAGE_HEADERS" \
                    "$IMAGE_URL" -o "$IMAGE_BIN"; then

                    IMAGE_HEADERS="$IMAGE_HEADERS" IMAGE_BIN="$IMAGE_BIN" python - <<'PY'
          import os
          from pathlib import Path

          headers = Path(os.environ["IMAGE_HEADERS"]).read_text(errors="replace").lower()
          image = Path(os.environ["IMAGE_BIN"]).read_bytes()

          print("image bytes =", len(image))
          if "content-type: image/png" not in headers:
              raise SystemExit("social image did not return image/png")
          if not image.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("social image response is not a valid PNG")
          if len(image) < 10_000:
              raise SystemExit("social image PNG is unexpectedly small")
          PY
                    ok=1
                    break
                  fi
                fi
              fi

              sleep 10
            done

            if [ "$ok" -ne 1 ]; then
              echo "$LABEL social card did not converge to the expected metadata/image."
              return 1
            fi

            echo "$LABEL is serving fresh Flow social metadata and a valid PNG."
          }

          verify_agent "Twitterbot" "Twitterbot/1.0"
          verify_agent "MetaExternalAgent" "meta-externalagent/1.1"
