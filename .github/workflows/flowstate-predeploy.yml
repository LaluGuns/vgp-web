name: Flowstate predeploy

on:
  pull_request:
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"
  push:
    branches: [main]
    paths:
      - "flowstate/**"
      - ".github/workflows/flowstate-predeploy.yml"

permissions:
  contents: read

concurrency:
  group: flowstate-predeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flowstate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

      - name: Verify v6 image in Vercel Preview
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          URL="https://flowstate-git-fix-flow-soci-7a2cfb-lalu-virzy-gunawans-projects.vercel.app/en/social-card-v6"
          ok=0
          for attempt in $(seq 1 24); do
            echo "Preview image check ${attempt}/24"
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 45 \
              -D /tmp/flow-v6.headers "$URL" -o /tmp/flow-v6.png; then
              if python - <<'PY'
          from pathlib import Path
          headers = Path('/tmp/flow-v6.headers').read_text(errors='replace').lower()
          image = Path('/tmp/flow-v6.png').read_bytes()
          print('image bytes =', len(image))
          if 'content-type: image/png' not in headers:
              raise SystemExit('not image/png')
          if not image.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('not a PNG')
          if len(image) < 10000:
              raise SystemExit('PNG unexpectedly small')
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Upload v6 preview image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flow-social-v6-preview
          path: /tmp/flow-v6.png
          if-no-files-found: error

      - name: Verify live social cards
        if: github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_IMAGE_PATH="/social-card-v5"

          verify_card() {
            local LABEL="$1"
            local PAGE_URL="$2"
            local USER_AGENT="$3"
            local PREFIX="$(echo "$LABEL" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
            local HTML="/tmp/flow-${PREFIX}.html"
            local IMAGE_URL_FILE="/tmp/flow-${PREFIX}-image-url"
            local IMAGE_HEADERS="/tmp/flow-${PREFIX}-image.headers"
            local IMAGE_BIN="/tmp/flow-${PREFIX}-image.bin"
            local ok=0

            for attempt in $(seq 1 24); do
              echo "$LABEL check ${attempt}/24"
              if curl --fail --silent --show-error --location \
                --user-agent "$USER_AGENT" --connect-timeout 10 --max-time 30 \
                "$PAGE_URL" -o "$HTML"; then
                if HTML="$HTML" IMAGE_URL_FILE="$IMAGE_URL_FILE" EXPECTED_IMAGE_PATH="$EXPECTED_IMAGE_PATH" python - <<'PY'
          import os
          from html.parser import HTMLParser

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta':
                      return
                  data = {k.lower(): v for k, v in attrs if k and v is not None}
                  key = data.get('property') or data.get('name')
                  value = data.get('content')
                  if key and value:
                      self.meta[key.lower()] = value

          parser = MetaParser()
          parser.feed(open(os.environ['HTML'], encoding='utf-8').read())
          expected = os.environ['EXPECTED_IMAGE_PATH']
          twitter_card = parser.meta.get('twitter:card', '')
          twitter_image = parser.meta.get('twitter:image', '')
          og_image = parser.meta.get('og:image', '')
          print('twitter:card =', twitter_card)
          print('twitter:image =', twitter_image)
          print('og:image =', og_image)
          if twitter_card != 'summary_large_image':
              raise SystemExit('wrong twitter card')
          if expected not in twitter_image or expected not in og_image:
              raise SystemExit('metadata is not serving v5')
          open(os.environ['IMAGE_URL_FILE'], 'w', encoding='utf-8').write(og_image)
          PY
                then
                  IMAGE_URL="$(cat "$IMAGE_URL_FILE")"
                  if curl --fail --silent --show-error --location \
                    --user-agent "$USER_AGENT" --connect-timeout 10 --max-time 45 \
                    -D "$IMAGE_HEADERS" "$IMAGE_URL" -o "$IMAGE_BIN"; then
                    if IMAGE_HEADERS="$IMAGE_HEADERS" IMAGE_BIN="$IMAGE_BIN" python - <<'PY'
          import os
          from pathlib import Path
          headers = Path(os.environ['IMAGE_HEADERS']).read_text(errors='replace').lower()
          image = Path(os.environ['IMAGE_BIN']).read_bytes()
          print('image bytes =', len(image))
          if 'content-type: image/png' not in headers:
              raise SystemExit('not image/png')
          if not image.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('not PNG')
          if len(image) < 10000:
              raise SystemExit('PNG too small')
          PY
                    then
                      ok=1
                      break
                    fi
                  fi
                fi
              fi
              sleep 10
            done

            test "$ok" -eq 1
            echo "$LABEL PASS"
          }

          verify_card "Twitter bare domain" "https://flow.virzyguns.com/?qa=20260822-social-v5" "Twitterbot/1.0"
          verify_card "Facebook bare domain" "https://flow.virzyguns.com/?qa=20260822-social-v5" "facebookexternalhit/1.1"
          verify_card "Twitter share v5" "https://flow.virzyguns.com/share-v5?qa=20260822-social-v5" "Twitterbot/1.0"
          verify_card "Facebook share v5" "https://flow.virzyguns.com/share-v5?qa=20260822-social-v5" "facebookexternalhit/1.1"
