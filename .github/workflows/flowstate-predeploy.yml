name: LinkedIn social QA

on:
  pull_request:
    paths:
      - ".github/workflows/flowstate-predeploy.yml"

permissions:
  contents: read

jobs:
  reverse-engineer-post-inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch LinkedIn Post Inspector app bundle
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36'
          curl --fail --silent --show-error --location --user-agent "$UA" \
            --connect-timeout 10 --max-time 30 \
            'https://static.licdn.com/aero-v1/sc/h/1dmt9ag4pwy2q52tz4m6tet83' \
            -o /tmp/app.js
          wc -c /tmp/app.js

      - name: Print exact inspect route and API modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/app.js').read_text(errors='ignore')
          targets=[
            'define("sharing-debugger-web/routes/inspect"',
            'define("sharing-debugger-web/models/post-inspector"',
            'define("sharing-debugger-web/utils/authentication-utils"',
            'define("sharing-debugger-web/adapters/application"',
            'define("sharing-debugger-web/serializers/post-inspector"',
            'define("sharing-debugger-web/router"',
            'postInspector',
          ]
          for target in targets:
              print('\n===== TARGET:',target,'=====')
              start=0
              count=0
              while True:
                  i=text.find(target,start)
                  if i < 0: break
                  a=max(0,i-300)
                  b=min(len(text),i+7000)
                  print(text[a:b])
                  count += 1
                  start=i+len(target)
                  if count>=8: break
              print('occurrences shown',count)
          PY
