name: DIRIXA legal verification

on:
  pull_request:
    branches: [main]
    paths:
      - "app/privacy/dirixa/**"
      - "app/terms/dirixa/**"
      - "app/terms/page.tsx"
      - ".github/workflows/dirixa-legal-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
