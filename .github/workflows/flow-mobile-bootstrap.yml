name: Flow mobile hybrid verify

on:
  push:
    branches:
      - flow-android-hybrid-v1
    paths:
      - "flowstate/package.json"
      - "flowstate/package-lock.json"
      - "flowstate/capacitor.config.ts"
      - "flowstate/mobile/**"
      - "!flowstate/mobile/android/**"
      - "flowstate/app/**"
      - "flowstate/components/**"
      - "flowstate/hooks/**"
      - "flowstate/lib/**"
      - "flowstate/public/**"
      - ".github/workflows/flow-mobile-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: flow-mobile-hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flowstate

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code -- package-lock.json; then
            echo "package-lock.json is stale. Refresh and commit it before CI."
            exit 1
          fi

      - name: Clean dependency install
        run: npm ci

      - name: Verify mobile source authority
        run: npm run mobile:verify

      - name: Run mobile regression tests
        run: npm run mobile:test

      - name: Typecheck mobile bundle
        run: npm run mobile:typecheck

      - name: Build mobile web bundle
        run: npm run mobile:build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
