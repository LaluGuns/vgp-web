name: Flowstate lock refresh

on:
  push:
    branches:
      - flow-google-play-rc3-hardening
    paths:
      - flowstate/package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flow-google-play-rc3-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowstate/package-lock.json
      - name: Refresh lockfile without package scripts
        working-directory: flowstate
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- flowstate/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flowstate/package-lock.json
          git commit -m "Refresh Flowstate package lock"
          git push origin HEAD:flow-google-play-rc3-hardening
